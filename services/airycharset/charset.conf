# AirymaxOS 字符编码设置
#
# 唯一事实源：docs-linux/180-i18n/02-encoding-spec.md。本文件只声明策略，
# 判定与转换由 /usr/bin/airy-charset 执行；两者读同一组键，不允许各写一套。
# 系统编码固定 UTF-8（§1.4），BOM 与非字符一律拒绝（§2.2）。
# 允许入站的外源编码只用于把存量数据转成 UTF-8，不改变系统编码。

CHARSET_ENC=UTF-8
CHARSET_SOURCES=GB18030,GBK,BIG5,SHIFT_JIS,ISO-8859-1
CHARSET_BOM=reject
CHARSET_NONCHAR=reject
CHARSET_COUNT=codepoint
