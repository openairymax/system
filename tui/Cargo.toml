# ===========================================================================
# AirymaxOS TUI 工作区
#
# 六个 crate 同处一个 Cargo 工作区，共用一份 Cargo.lock：锁文件是整机
# 可复现构建的最小单位，按 crate 分锁会让同一次发行里出现两套依赖树。
#
# 外部依赖只在此处声明一次，crate 清单一律用 `{ workspace = true }` 继承。
# 白名单的每一条都有出处，不接受「写了再说」：
#   rustix              §14.3 要求精确设置 termios 并用 poll 读取，而工作区
#                       禁止 unsafe，故终端系统调用必须由安全封装提供。
#                       选 rustix 而非 nix：前者不链接 libc crate，走
#                       linux-raw-sys 的原始常量，依赖面更窄。`std` 只把
#                       fd 类型换成标准库的 BorrowedFd/OwnedFd，使
#                       std::fs::File 可直接交给 termios 与 poll；它不启用
#                       libc 后端，常量仍来自 linux-raw-sys。
#   unicode-width       §14.4 明确要求 vendored 并钉版本，列宽只此一处算法。
#   unicode-segmentation §14.4 明确要求 vendored 并钉版本，截断落在字素簇边界。
#   serde_json         §10.2 的 Structured 载荷按契约是 JSON 值，接入侧只做
#                       语法校验、不解释动作语义；手写解析器无法承担转义与
#                       数值边界，故用经过审计的现成实现。
#   serde              §2.1 的字段表是契约文本，派生实现只把字段名与类型
#                       对应过去，不为每个字段手写一遍匹配；未知字段保持
#                       §6 的「消费方忽略」语义。
#
# vendor 目录是离线构建的唯一来源，`.cargo/config.toml` 指向它并置
# offline，任何绕过白名单的依赖在无网环境里直接构建失败。
# ===========================================================================
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
rustix = { version = "1.1.6", default-features = false, features = [
    "event",
    "std",
    "stdio",
    "termios",
] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
serde = { version = "1.0.229", default-features = false, features = [
    "derive",
    "std",
] }

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "AGPL-3.0-or-later OR Apache-2.0"
authors = ["SPHARX Ltd."]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "deny"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
