# 引导期 TUI 会话层。承 U 模块：终端初始化、帧循环、版面与状态面。
[package]
name = "boot-tui"
description = "Boot-time TUI session layer for AirymaxOS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[[test]]
name = "degrade"
path = "tests/degrade/main.rs"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

[[test]]
name = "field"
path = "tests/field/main.rs"

[[test]]
name = "frame_budget"
path = "tests/frame_budget.rs"

[[test]]
name = "matrix"
path = "tests/matrix/main.rs"

[[bench]]
name = "frame"
harness = false

[dev-dependencies]
asr-gateway = { path = "../asr-gateway" }
boot-ime = { path = "../boot-ime" }

[dependencies]
airy-adapters = { path = "../airy-adapters" }
intent = { path = "../intent" }
rustix.workspace = true
serde_json.workspace = true
signal-hook = { version = "0.3.18", default-features = false }
unicode-segmentation.workspace = true
unicode-width.workspace = true
