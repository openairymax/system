# ===========================================================================
# system/tui/modmap.toml — docs-linux 十九个功能模块的入口映射
#
# 三列口径（模块 → 入口 → 判据）是 0.0.5 方案 §2.5 的验收底线：每个模块
# 要么在本版给出可观测入口与两条判据（成功一路、失败一路），要么明确登记
# 承接版本，不允许以「待办」留白。`scope = covered` 的 entry 必须是仓库内
# 真实存在的路径；`scope = deferred` 的 entry 固定为 `-`，note 以承接版本
# 开头。两张表（本文件与 crates/airy-adapters/src/modmap.rs）必须逐字段
# 一致，由 ci/gates/doc-contract.sh 判定，改一侧不改另一侧即判负。
#
# 为什么入口是路径而不是界面元素：入口是「该模块在会话层被观测到的第一条
# 通路」，可以是可执行文件、适配器模块或门禁脚本；写成界面位置会在布局
# 调整后立刻失真，而路径由死代码扫描与门禁同时看住。
# ===========================================================================

[[module]]
code = "L"
name = "工具链与 CI/CD"
scope = "covered"
entry = "ci/ci.sh"
ok = "ci/ci.sh --list 列出门禁全集，ci/lint.sh --no-distro 退出 0"
fail = "任一判据返回 1 时打印分组名与首个失败断言，不吞错"
note = "门禁目录只做分发，判据在 ci/gates 与 ci/checks"

[[module]]
code = "A"
name = "核心 syscall 与 Capability Folding"
scope = "deferred"
entry = "-"
ok = "-"
fail = "-"
note = "0.0.24 起按内核窗口承接：折叠语义属内核侧，会话层不自行解释"

[[module]]
code = "M"
name = "发行版工程与磁盘管理"
