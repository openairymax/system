# 模型运行根的属主与权限
#
# 同一个目录上有三方：资产由 root 安装、服务以 airy 运行、桌面状态面板
# 以登录用户读取。三者要同时成立，只能由一条声明式条目给出，不能靠谁
# 先创建：root 先建，服务就落不下状态文件；服务先建（StateDirectory
# 0750 root 不可写），手工安装就得绕道。
#
# 0755 让非特权会话读到清单与权重（权重是公开资产），属主给服务账户，
# 状态文件才写得进去。条目每次启动重放，属主或权限漂移随之自愈。
d /var/lib/airy-llm 0755 airy airy -
