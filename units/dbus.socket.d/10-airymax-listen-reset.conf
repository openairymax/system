# ===========================================================================
# 10-airymax-listen-reset.conf — 清空 dbus.socket 的监听地址列表
#
# 发行版 dbus.socket 把 ListenStream 写成 legacy 目录下的
# /var/run/dbus/system_bus_socket。systemd 解析时把它改写成
# /run/dbus/system_bus_socket，并打印一条告警——告警用一个 U+2192 箭头连接
# 旧路径与新路径。冷启动阶段这条告警走 /dev/kmsg 直落本地屏，而 VT 字体
# latarcyrheb-sun16 没有该字形，屏幕上于是多出一个方块：285H 冷启动时
# journalctl -k -b 的非 ASCII 行只剩这一条。
#
# ListenStream 是列表型指令，drop-in 里直接赋值只是追加，清不掉 vendor 的
# 旧路径。systemd 约定的做法是先空赋值重置列表，再写入规范路径：本文件负责
# 重置，20-airymax-listen-run.conf 负责赋值。拆成两个文件是因为本仓库的
# 单元校验器按 INI 语义解析 drop-in，同一文件内的重复键即违约。
# ===========================================================================
[Socket]
ListenStream=
