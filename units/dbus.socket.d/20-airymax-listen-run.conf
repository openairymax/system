# ===========================================================================
# 20-airymax-listen-run.conf — 把 dbus.socket 的监听地址写到 /run
#
# 与 10-airymax-listen-reset.conf 配对：前一个文件清空列表，本文件写入
# 规范路径。路径取 /run 而不是 /var/run：二者在镜像里指向同一 inode
# （/var/run 是指向 ../run 的符号链接），但只有 /run 是 systemd 认的规范
# 写法，告警因此不再产生，监听地址与 dbus-daemon 的 --address=systemd:
# 激活通道完全一致。
# ===========================================================================
[Socket]
ListenStream=/run/dbus/system_bus_socket
