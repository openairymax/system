# 50-console-ascii.conf — 开机屏幕上的 fsck 结论必须存在，且必须是 ASCII
#
# 两个发行版单元（systemd-fsck-root.service 与 systemd-fsck@.service）都只
# 写 stdout，没有显式 StandardOutput，于是走服务默认的 journal：e2fsck 的
# 结论只进日志，屏幕上什么也没有。根文件系统卡在 fsck 时，现场看到的只有
# 一片静止，而卡死原因就在那行没人转发的文本里。
#
# 因此这里补上 journal+console：结论既进日志（可追溯），也落本地屏（可判读）。
# 转发之后紧接着的第二个问题是措辞本身——e2fsck 经 gettext 取语言，装机
# 配方写的是 lang zh_CN.UTF-8，屏幕上会变成
#   /dev/nvme0n1p2: 没有问题，……
# 而本地屏是 Linux VT，镜像 FONT 为 latarcyrheb-sun16，没有 CJK 字形（VT
# 字体上限 512 个字形，装不进中文字库），整行只剩方块与空白，正是 285H
# 冷启动乱码里的那一行。
#
# 修法不是丢掉输出，而是把本单元的 locale 钉成 C：措辞回到英文，屏幕上
# 仍是可读的一行。桌面会话的语言不受影响——Environment 只作用于本单元，
# 用户会话读的仍是 locale.conf 的 zh_CN。
# ===========================================================================
[Service]
StandardOutput=journal+console
Environment=LANG=C LC_ALL=C
