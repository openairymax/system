# 50-console-ascii.conf — 开机屏幕上的 fsck 结论必须是 ASCII
#
# systemd-fsck 与 systemd-fsck@ 的发行版单元带 StandardOutput=journal+console，
# e2fsck 的进度行因此直接落到本地屏。e2fsck 经 gettext 取措辞，而装机配方
# 写的是 lang zh_CN.UTF-8，于是屏幕上出现
#   /dev/nvme0n1p2: 没有问题，……
# 这一类整行中文。
#
# 本地屏是 Linux VT，镜像的 FONT 为 latarcyrheb-sun16，没有 CJK 字形，且 VT
# 字体上限 512 个字形，装不进中文字库：这行中文到达屏幕时只剩方块与空白。
# 285H 冷启动的乱码里就有这一行。
#
# 不改 StandardOutput 而改 locale：这一行是「卡在哪个文件系统」的唯一线索，
# 丢掉它等于把开机卡死的原因一起丢掉。把 locale 钉成 C，措辞回到英文，
# 屏幕上仍是可读的一行。桌面会话的语言不受影响——locale.conf 只被本单元的
# Environment 覆盖，用户会话读到的仍是 zh_CN。
# ===========================================================================
[Service]
Environment=LANG=C LC_ALL=C
