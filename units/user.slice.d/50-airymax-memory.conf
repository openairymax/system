# ===========================================================================
# user.slice.d/50-airymax-memory.conf — 会话工作负载的内存边界
#
# 285H 现场：AirymaxRT 在自己的用户会话里拉起三个 llama-server，RSS 合计
# 29.5G / 30G，swap 再吃掉 11G。这些进程不在任何单元里，airymax-agent.slice
# 的上限管不到它们；整机随后在回收与分配之间打转，SSH 与桌面一起失联，
# rpmbuild 期间还出现过两次各约三分钟的整机 stall。
#
# 会话池是「客户」而不是「主人」：模型由 AirymaxRT 直接 exec 出来时，它拿到
# 的只是用户会话的默认 cgroup，没有任何上限。边界因此必须落在 user.slice
# 上——这是所有会话 scope 的共同父节点，无论谁 spawn 都逃不出去。
#
# 取 85% 而不是 90%：另外一成半要留给内核、system.slice（sshd、NetworkManager、
# journald）与回写路径。推理负载的正式归属仍是 airymax-agent.slice（90%）：
# 由单元拉起的推理在那一层，会话池这一层只兜住「没有经过单元」的那部分，
# 两层不叠加到同一批进程上。
#
# 同样只声明硬上限、不声明 MemoryHigh：目标机是 cgroup v1 hybrid 层级，
# MemoryHigh 是 v2 专有属性，在 v1 上 systemd 不会写 memory.soft_limit_in_bytes，
# 声明它只会制造「看起来有软限」的假象。越过硬上限时由 memory 控制器在
# 本组内选 victim，代价是一个实例被 OOM 杀掉，换来的是整机与 SSH 仍然可用——
# 这正是 285H 缺失的那条边界。
#
# 换页也必须一起限。285H 实测：只写 MemoryMax 时，越过上限的页不是被拒绝，
# 而是被换出——会话 scope 的 swap 记账达到 13.8G，整机 swap 16G 只剩 1G，
# 回收路径长期在「换出—再缺页」之间往返。memory.memsw.limit_in_bytes 在该
# 内核上可写，memory.stat 的 swap 字段按组非零，说明 memsw 记账可用，
# MemorySwapMax 会真正落成换页上限。取 15%：内存与换页合计不超过物理内存
# 一整个，常驻不超过八成半，剩下的一成半无论怎么换页都不能被会话池占用。
# ===========================================================================

[Slice]
MemoryMax=85%
MemorySwapMax=15%
